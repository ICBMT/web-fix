        <h1>GreePixel — UI/UX design studio for web apps, mobile apps, SaaS and websites</h1>
        <p>GreePixel is a senior UI/UX design studio based in Lahore, Pakistan, working remotely with startups and businesses worldwide, including the US, UK, UAE and Australia. Since 2019 we have designed 150+ digital products: SaaS dashboards, mobile apps, AI products, healthcare, EdTech, fintech and e-commerce experiences.</p>
        <h2>UI/UX design services</h2>
        <ul>
          <li>UX research and strategy: user interviews, analytics, journey maps and usability testing</li>
          <li>UI design: pixel-perfect, accessible (WCAG) interfaces in Figma</li>
          <li>MVP product design: idea to clickable, investor-ready prototype in 4–8 weeks</li>
          <li>SaaS and dashboard UX: admin panels, data visualisation and B2B workflows</li>
          <li>Mobile app design for iOS and Android</li>
          <li>Design systems: design tokens, component libraries and developer hand-off</li>
          <li>UX audits and redesigns of live products</li>
          <li>Interaction, motion and 3D (WebGL) design</li>
        </ul>
        <h2>Selected UI/UX case studies</h2>
        <p>Jalebi (restaurant SaaS UX), Startwise (AI SaaS workspace), Lairo (AI app UI), ON Card (NFC business card app), GCC Fitness (bilingual English/Arabic fitness marketplace), Shepherd (AI tutor app), Find a Doc (healthcare booking app), Kim &amp; Co (sales dashboard UX), MTS (EdTech product redesign) and more.</p>
